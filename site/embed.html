<!-- she persisted - episodes page. This file is plain ASCII on purpose (special characters are written as \u escapes) so pasting can't garble it. Paste this whole file into a Code Block (mode HTML) in a section above the blog list on /episodes. Set PAGES_BASE below to the GitHub Pages URL of this repo. -->
<div id="sp-episodes" hidden><div class="sp-in"></div></div>
<style>
/* Stock Squarespace blog list: hidden while the custom page is showing. */
html.sp-ep-custom section:has(.collection-content-wrapper){display:none!important}
html.sp-ep-custom .collection-content-wrapper,html.sp-ep-custom .blog-list-pagination,html.sp-ep-custom #itemPagination{display:none!important}
/* The section holding this Code Block: no side or bottom padding, no width cap.
   padding-top is left alone: Squarespace sets it to the fixed header's height. */
section.sp-ep-section{padding-right:0!important;padding-bottom:0!important;padding-left:0!important;min-height:0!important}
section.sp-ep-section>.content-wrapper{padding:0!important;max-width:none!important;width:100%!important}
html.sp-ep-stock section.sp-ep-section{display:none!important}

#sp-episodes{container-type:inline-size;background:#f7f7ef;color:#740000;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;font-weight:400;line-height:1.2;letter-spacing:-.44px;text-align:left;text-transform:none;-webkit-text-size-adjust:100%}
#sp-episodes[hidden]{display:none}
#sp-episodes .sp-in{--red:#740000;--cream:#f7f7ef;--ink:#1c1c1c;--g:64px;--g:clamp(32px,4.444cqw,64px);--card:320px;--card:clamp(240px,22.222cqw,320px)}
#sp-episodes *,#sp-episodes *::before,#sp-episodes *::after{box-sizing:border-box}
#sp-episodes a{color:inherit;text-decoration:none;background:none;border:0;transition:opacity 150ms}
#sp-episodes img{display:block;max-width:none;margin:0;border:0}
#sp-episodes h2{margin:0;padding:0;font-family:inherit;font-size:38px;font-size:clamp(26px,2.639cqw,38px);font-weight:700;line-height:1;letter-spacing:-.6px;color:inherit;text-transform:none}
#sp-episodes h2 span{font-weight:400}
#sp-episodes a:focus,#sp-episodes input:focus{outline:none}
#sp-episodes a:focus-visible{outline:2px solid currentColor;outline-offset:2px}
#sp-episodes a.sp-text:hover,#sp-episodes a.sp-pill:hover{opacity:.75}

/* 1. hero */
#sp-episodes .sp-hero{background:var(--red);color:var(--cream);padding:16px 0 56px var(--g);margin-top:-1px}
#sp-episodes .sp-hero-box{position:relative}
#sp-episodes .sp-clip{overflow:hidden}
#sp-episodes .sp-track{display:flex;gap:28px;transition:transform 450ms ease;touch-action:pan-y}
#sp-episodes .sp-track.sp-drag{transition:none}
#sp-episodes .sp-slide{position:relative;flex:none;width:1120px;width:min(1120px,calc(100cqw - var(--g)*2 - 192px));aspect-ratio:16/9;max-height:max(420px,calc(100vh - 230px));display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:32px;border-radius:16px;overflow:hidden;color:var(--cream);background:var(--cream);-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
#sp-episodes .sp-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;pointer-events:none}
#sp-episodes .sp-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.8));pointer-events:none}
#sp-episodes .sp-kicker{position:relative;align-self:flex-start;background:var(--red);padding:5px 12px 7px;font-size:15px;font-weight:700;line-height:1}
#sp-episodes .sp-slide-title{position:relative;max-width:680px;font-size:36px;font-size:clamp(24px,2.5cqw,36px);font-weight:700;line-height:1.05}
#sp-episodes .sp-slide:focus-visible{outline-offset:-4px}

/* shelves */
/* The page ends on the red band, flush with the red footer, unless a topic or results shelf is open below it. */
#sp-episodes .sp-stack{display:flex;flex-direction:column;gap:72px;padding:64px 0 0}
#sp-episodes .sp-below{display:flex;flex-direction:column;gap:72px;padding-bottom:96px}
#sp-episodes .sp-below[hidden],#sp-episodes .sp-below>div:empty{display:none}
#sp-episodes .sp-shelf{display:flex;flex-direction:column;gap:18px}
#sp-episodes .sp-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:0 var(--g)}
#sp-episodes .sp-head>.sp-text,#sp-episodes .sp-count{flex:none;font-size:14px}
#sp-episodes .sp-count{font-size:13px;opacity:.8}
/* 8px of vertical room so a card growing on hover isn't clipped by the scroller */
#sp-episodes .sp-row{display:flex;gap:20px;padding:8px var(--g);margin:-8px 0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 96%,transparent);mask-image:linear-gradient(90deg,#000 96%,transparent)}
#sp-episodes .sp-row::-webkit-scrollbar{display:none}
/* once a row has been scrolled, cards are cut off on the left too, so fade that edge as well */
#sp-episodes .sp-row-wrap:not(.sp-at-start) .sp-row{-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#sp-episodes .sp-card{flex:none;width:var(--card);display:flex;flex-direction:column}
#sp-episodes .sp-thumb{display:block;overflow:hidden;border-radius:16px;background:var(--cream);isolation:isolate}
#sp-episodes .sp-card img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 30%;filter:grayscale(1);transition:transform 300ms ease,filter 300ms ease}
#sp-episodes .sp-card-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:14px 4px 0;font-size:18px;font-weight:700;line-height:1.2;color:var(--ink)}

/* red bands */
#sp-episodes .sp-band{display:flex;flex-direction:column;background:var(--red);color:var(--cream)}
#sp-episodes .sp-band h2{padding:0 var(--g)}
#sp-episodes .sp-recs{gap:20px;padding:48px 0 56px}
#sp-episodes .sp-recs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:0 var(--g)}
#sp-episodes .sp-rec{display:flex;flex-direction:column}
#sp-episodes .sp-frame{display:block;overflow:hidden;border-radius:16px;background:var(--cream);isolation:isolate}
#sp-episodes .sp-frame img{width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform 300ms ease}
#sp-episodes .sp-rec-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:14px 4px 0;font-size:18px;font-weight:700;line-height:1.2}
#sp-episodes .sp-topics{gap:28px;padding:56px 0 72px}
#sp-episodes .sp-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 20px;padding:0 var(--g)}
#sp-episodes .sp-tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
#sp-episodes .sp-tile .sp-frame{width:100%}
#sp-episodes .sp-tile-label{padding-bottom:1px;font-size:16px;font-weight:700;line-height:1.1}
#sp-episodes .sp-tile.sp-active .sp-tile-label{box-shadow:inset 0 -1px 0 var(--cream)}
#sp-episodes .sp-search-wrap{display:flex;padding:8px var(--g) 0}
#sp-episodes .sp-search{display:flex;align-items:center;gap:12px;width:100%;height:56px;margin:0;padding:0 20px;border:1.5px solid var(--cream);border-radius:999px;cursor:text}
#sp-episodes .sp-search svg{flex:none;width:18px;height:18px}
#sp-episodes .sp-search input{flex:1;min-width:0;width:auto;height:auto;margin:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;color:var(--cream);font:inherit;font-size:17px;letter-spacing:inherit;-webkit-appearance:none;appearance:none}
#sp-episodes .sp-search input::placeholder{color:var(--cream);opacity:.8}
#sp-episodes .sp-search input::-webkit-search-cancel-button{display:none}
#sp-episodes .sp-search:focus-within{outline:2px solid var(--cream);outline-offset:2px}
#sp-episodes .sp-pills{display:none}

/* mobile topic sheet: appended to <body>, because #sp-episodes is a size container and would trap position:fixed */
.sp-ep-sheet{position:fixed;inset:0;z-index:100000;display:flex;align-items:flex-end;background:rgba(0,0,0,.4);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.44px;-webkit-tap-highlight-color:transparent}
.sp-ep-sheet .sp-sheet-panel{width:100%;max-height:75vh;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0;background:#f7f7ef;color:#740000}
.sp-ep-sheet .sp-sheet-handle{display:block;width:36px;height:4px;margin:0 auto 10px;padding:0;border:0;border-radius:999px;background:rgba(116,0,0,.25);-webkit-appearance:none;appearance:none}
.sp-ep-sheet a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid rgba(116,0,0,.2);color:#740000;font-size:17px;font-weight:400;line-height:1.2;text-decoration:none;text-transform:none}
.sp-ep-sheet a:first-of-type{border-top:0}
.sp-ep-sheet a.sp-on{font-weight:700}

/* archive page: "all episodes" or one tag */
/* sidebar + list are centred as a block, so wide windows get even margins instead of a gap on the right */
#sp-episodes .sp-arch{display:grid;grid-template-columns:220px minmax(0,900px);justify-content:center;gap:20px 40px;align-items:start;padding:48px var(--g) 96px}
#sp-episodes .sp-arch>*{grid-column:2}
#sp-episodes .sp-side{grid-column:1;grid-row:1/span 4;position:sticky;top:calc(var(--sp-top,0px) + 24px);display:flex;flex-direction:column;gap:20px}
#sp-episodes .sp-side-kicker{font-size:12px;font-weight:700;letter-spacing:.04em}
#sp-episodes .sp-side-list{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.1}
#sp-episodes .sp-side-item{padding:9px 12px;border-radius:10px}
#sp-episodes .sp-side-item:hover{opacity:.75}
#sp-episodes .sp-side-item.sp-on{background:var(--red);color:var(--cream);font-weight:700}
#sp-episodes .sp-back,#sp-episodes .sp-seg{display:none}
#sp-episodes .sp-arch-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
#sp-episodes h1{margin:0;padding:0;font-family:inherit;font-size:56px;font-weight:700;line-height:1;letter-spacing:-1px;color:inherit;text-transform:none;white-space:nowrap}
#sp-episodes .sp-arch-head .sp-count{font-size:14px}
#sp-episodes .sp-feed{display:flex;flex-direction:column}
#sp-episodes .sp-item{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;align-items:center;padding:20px 0;border-top:1px solid rgba(116,0,0,.2)}
#sp-episodes .sp-item .sp-thumb{border-radius:12px}
#sp-episodes .sp-item img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center 30%;filter:grayscale(1);transition:transform 300ms ease,filter 300ms ease}
#sp-episodes .sp-item-text{display:flex;flex-direction:column;gap:8px}
#sp-episodes .sp-item-title{font-size:22px;font-weight:700;line-height:1.15;color:var(--ink)}
#sp-episodes .sp-item-excerpt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.4;color:var(--ink);opacity:.75}
#sp-episodes .sp-more-wrap{display:flex;justify-content:center;padding-top:4px}
#sp-episodes .sp-more-wrap[hidden]{display:none}
#sp-episodes button.sp-more{margin:0;padding:14px 28px;border:1px solid var(--red);border-radius:999px;background:none;color:var(--red);font:inherit;font-size:15px;line-height:1;letter-spacing:inherit;text-transform:none;box-shadow:none;cursor:pointer;-webkit-appearance:none;appearance:none;transition:opacity 150ms}
#sp-episodes button.sp-more:hover{opacity:.75}
#sp-episodes button.sp-more:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* carousel arrows: one thin chevron in the side gutter, no background, shown only while the row is hovered;
   the left one appears only after the row has moved */
#sp-episodes button.sp-arrow{position:absolute;z-index:2;top:0;display:none;align-items:center;justify-content:center;width:var(--g);min-width:0;height:auto;margin:0;padding:0;border:0;border-radius:0;background:none;color:var(--red);box-shadow:none;cursor:pointer;-webkit-appearance:none;appearance:none;opacity:0;transition:opacity 150ms}
#sp-episodes button.sp-arrow:focus{outline:none}
#sp-episodes button.sp-arrow:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
#sp-episodes button.sp-arrow svg{width:28px;height:28px}
#sp-episodes .sp-row-wrap{position:relative}
#sp-episodes .sp-row-wrap .sp-arrow{height:var(--card)}
#sp-episodes .sp-hero .sp-arrow{bottom:0;color:var(--cream)}
#sp-episodes .sp-hero .sp-prev{left:calc(var(--g)*-1)}
#sp-episodes .sp-prev{left:0}
#sp-episodes .sp-next{right:0}
@media (hover:hover){
  #sp-episodes button.sp-arrow{display:flex}
  #sp-episodes .sp-row-wrap.sp-noscroll .sp-arrow,#sp-episodes .sp-row-wrap.sp-at-start .sp-prev,#sp-episodes .sp-hero:not(.sp-moved) .sp-prev{display:none}
  #sp-episodes .sp-row-wrap:hover .sp-arrow,#sp-episodes .sp-hero:hover .sp-arrow,#sp-episodes button.sp-arrow:focus-visible{opacity:1}
}

/* hover: the title underlines and the photo zooms slightly inside its fixed frame (shelf thumbnails also turn to color); the hero stays still */
@media (hover:hover){
  #sp-episodes .sp-card:hover img,#sp-episodes .sp-item:hover img{transform:scale(1.05);filter:grayscale(0)}
  #sp-episodes .sp-rec:hover .sp-frame img,#sp-episodes .sp-tile:hover .sp-frame img{transform:scale(1.05)}
  #sp-episodes .sp-item:hover .sp-item-title,#sp-episodes .sp-card:hover .sp-card-title,#sp-episodes .sp-rec:hover .sp-rec-title,#sp-episodes .sp-tile:hover .sp-tile-label{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
}
#sp-episodes .sp-card:focus-visible img,#sp-episodes .sp-item:focus-visible img{filter:grayscale(0)}

@media (max-width:900px) and (min-width:601px){
  #sp-episodes .sp-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  #sp-episodes .sp-arch{grid-template-columns:170px minmax(0,1fr);gap:20px 28px}
}

/* mobile */
@media (max-width:600px){
  #sp-episodes .sp-in{--g:20px;--card:164px}
  #sp-episodes h2{font-size:22px;letter-spacing:-.44px}
  /* hero: a native paged scroller (one card per flick, snaps to centre); the track's own 20px padding is the gutter */
  #sp-episodes .sp-hero{padding:14px 0 28px}
  #sp-episodes .sp-clip{overflow:visible}
  #sp-episodes .sp-track{gap:10px;padding:0 20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none;transform:none!important;transition:none;touch-action:pan-x pan-y}
  #sp-episodes .sp-track::-webkit-scrollbar{display:none}
  #sp-episodes .sp-slide{flex:0 0 calc(100cqw - 40px);width:auto;aspect-ratio:5/4;max-height:none;gap:6px;padding:20px;border-radius:14px;scroll-snap-align:center;scroll-snap-stop:always}
  #sp-episodes .sp-slide[aria-hidden]{display:none}
  #sp-episodes .sp-kicker{padding:5px 12px 7px;font-size:12px}
  #sp-episodes .sp-slide-title{font-size:20px;line-height:1.05}
  #sp-episodes .sp-stack{gap:32px;padding:28px 0 0}
  #sp-episodes .sp-below{gap:32px;margin-top:-8px;padding-bottom:40px}
  #sp-episodes .sp-shelf{gap:14px}
  #sp-episodes .sp-head>.sp-text,#sp-episodes .sp-count{font-size:12px;opacity:.8}
  #sp-episodes .sp-row{gap:12px;scroll-snap-type:x mandatory;scroll-padding-left:20px;-webkit-mask-image:linear-gradient(90deg,#000 94%,transparent);mask-image:linear-gradient(90deg,#000 94%,transparent)}
  #sp-episodes .sp-row-wrap:not(.sp-at-start) .sp-row{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  #sp-episodes .sp-card{scroll-snap-align:start}
  #sp-episodes .sp-thumb{border-radius:14px}
  #sp-episodes .sp-card-title{padding:8px 2px 0;font-size:14px}
  #sp-episodes .sp-desktop-only,#sp-episodes button.sp-arrow{display:none!important}
  #sp-episodes .sp-recs{gap:14px;padding:28px 0 32px}
  #sp-episodes .sp-recs-grid{grid-template-columns:minmax(0,1fr);gap:16px}
  #sp-episodes .sp-frame{border-radius:14px}
  #sp-episodes .sp-rec-title{padding:8px 2px 0;font-size:14px}
  #sp-episodes .sp-topics{gap:14px;padding:28px 20px 36px}
  #sp-episodes .sp-topics h2{padding:0}
  #sp-episodes .sp-tiles{display:none}
  #sp-episodes .sp-search-wrap{order:1;padding:0}
  #sp-episodes .sp-search{width:100%;height:48px;gap:10px;padding:0 16px}
  #sp-episodes .sp-search svg{width:16px;height:16px}
  /* 16px, not the 15px in the design: anything smaller makes iOS zoom the page on focus. */
  #sp-episodes .sp-search input{font-size:16px}
  #sp-episodes .sp-pills{order:2;display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
  #sp-episodes .sp-pill{padding:10px 14px;border:1px solid var(--cream);border-radius:999px;font-size:14px;line-height:1;white-space:nowrap}
  #sp-episodes .sp-pill.sp-active{background:var(--cream);color:var(--red)}
  #sp-episodes .sp-arch{grid-template-columns:minmax(0,1fr);gap:16px;padding:24px 20px 40px}
  #sp-episodes .sp-arch>*{grid-column:1}
  #sp-episodes .sp-side{display:none}
  #sp-episodes .sp-back{display:inline-flex;align-items:center;gap:6px;order:1;justify-self:start;font-size:14px}
  #sp-episodes .sp-back span{font-size:18px;line-height:1}
  #sp-episodes .sp-arch-head{order:2}
  #sp-episodes .sp-arch-head .sp-count{font-size:12px}
  #sp-episodes h1{font-size:32px;letter-spacing:-.6px;white-space:normal}
  /* segmented control: all, the three featured topics (short labels), and "more" which opens the sheet */
  #sp-episodes .sp-seg{order:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:3px;border-radius:999px;background:rgba(116,0,0,.08)}
  #sp-episodes .sp-seg a,#sp-episodes .sp-seg button{margin:0;padding:10px 4px;border:0;border-radius:999px;background:none;color:inherit;font:inherit;font-size:13px;font-weight:400;line-height:1;letter-spacing:inherit;text-align:center;text-transform:none;white-space:nowrap;box-shadow:none;cursor:pointer;-webkit-appearance:none;appearance:none}
  #sp-episodes .sp-seg .sp-on{background:var(--red);color:var(--cream);font-weight:700}
  #sp-episodes .sp-feed{order:4;margin-top:8px}
  #sp-episodes .sp-more-wrap{order:5;padding-top:16px}
  #sp-episodes button.sp-more{padding:12px 24px;font-size:14px}
  #sp-episodes .sp-item{grid-template-columns:88px minmax(0,1fr);gap:16px;padding:16px 0}
  #sp-episodes .sp-item-title{font-size:17px}
  #sp-episodes .sp-item-text{gap:6px}
  #sp-episodes .sp-item-excerpt{-webkit-line-clamp:2;font-size:14px;line-height:1.35}
}
@media (prefers-reduced-motion:reduce){
  #sp-episodes .sp-track{transition:none}
  #sp-episodes .sp-card:hover img,#sp-episodes .sp-item:hover img,#sp-episodes .sp-rec:hover .sp-frame img,#sp-episodes .sp-tile:hover .sp-frame img{transform:none}
}
</style>
<script>
(function () {
  var CFG = {
    // GitHub Pages root of the she-persisted-episodes repo (trailing slash).
    PAGES_BASE: 'https://sadiekilar.github.io/she-persisted-episodes/',
    // The Squarespace blog collection that holds the episode posts.
    COLLECTION: '/episodes',
    // How many episodes the "latest" row holds (the newest one is in the hero, so the row starts at the second).
    LATEST_COUNT: 20,
    FEATURED: ['anxiety', 'self-improvement', 'depression', 'relationships'],
    // Hard-coded until the "sadie recommends" tag is on all three in Squarespace.
    RECOMMENDS: [261, 228, 242],
    RECOMMENDS_TAG: 'sadie recommends',
    // Hero rotation, in order. rec = episode number; topic = tag, photo = episode whose
    // thumbnail stands in for it (the newest episode in the tag when left out).
    // image = a file in site/assets/hero/ to use instead of the episode thumbnail.
    // The "new episode" slide always links to the newest post; its image is a fixed brand photo.
    HERO: [
      { latest: true, image: 'latest.jpg' },
      { topic: 'depression', image: 'depression.jpg' },
      { rec: 261, image: '261.jpg' },
      { topic: 'anxiety', photo: 249, image: 'anxiety.jpg' },
      { rec: 228, image: '228.jpg' },
      { topic: 'relationships', photo: 257, image: 'relationships.jpg' },
      { rec: 242, image: '242.jpg' },
      { topic: 'dbt', image: 'dbt.jpg' }
    ],
    // Mobile archive segmented control: tag + short label (keep labels to ~8 characters or the control wraps).
    // Every other tag goes in the "more" sheet.
    SEGMENTS: [
      { tag: null, label: 'all' },
      { tag: 'anxiety', label: 'anxiety' },
      { tag: 'self-improvement', label: 'growth' },
      { tag: 'depression', label: 'mood' }
    ],
    HERO_INTERVAL: 6000,
    CACHE_KEY: 'sp:episodes:v1',
    CACHE_TTL: 60 * 60 * 1000

    function item(e) {
      return '<a class="sp-item" href="' + esc(e.url) + '"><span class="sp-thumb">' + img(thumb(e.image, '500w'), shown < 6) + '</span>' +
        '<span class="sp-item-text"><span class="sp-item-title">' + esc(e.title) + '</span>' + (e.excerpt ? '<span class="sp-item-excerpt">' + esc(e.excerpt) + '</span>' : '') + '</span></a>';
    }
    inner.innerHTML = '<div class="sp-arch">' +
      '<nav class="sp-side" aria-label="browse episodes"><span class="sp-side-kicker">BROWSE</span><div class="sp-side-list">' + side(null) + tags.slice().sort().map(side).join('') + '</div></nav>' +
      '<a class="sp-text sp-back" href="' + esc(CFG.COLLECTION) + '"><span>\u2039</span>episodes</a>' +
      '<div class="sp-arch-head"><h1>' + esc(tag || 'all episodes') + '</h1><span class="sp-count">' + countLabel(list.length) + '</span></div>' +
      '<div class="sp-seg">' + CFG.SEGMENTS.map(function (g) {
        return '<a href="' + esc(g.tag ? tagUrl(g.tag) : CFG.COLLECTION + '?view=all') + '"' + ((g.tag || null) === (tag || null) ? ' class="sp-on" aria-current="page"' : '') + '>' + esc(g.label) + '</a>';
      }).join('') + '<button type="button" class="sp-seg-more' + (inSegments ? '' : ' sp-on') + '" aria-haspopup="dialog">more \u25be</button></div>' +
      '<div class="sp-feed"></div>' +
      '<div class="sp-more-wrap"><button type="button" class="sp-more">load more</button></div>' +
      '</div>';
    var feed = inner.querySelector('.sp-feed');
    var more = inner.querySelector('.sp-more-wrap');
    function add() {
      var next = list.slice(shown, shown + PAGE);
      var htmlStr = '';
      next.forEach(function (e) { htmlStr += item(e); shown++; });
      feed.insertAdjacentHTML('beforeend', htmlStr);
      more.hidden = shown >= list.length;
    }
    more.querySelector('button').addEventListener('click', add);
    add();
    inner.querySelector('.sp-seg-more').addEventListener('click', function () { openSheet(tag); });
  }

  // Bottom sheet listing every tag that isn't a segment (mobile "more").
  var sheet = null;
  function closeSheet() {
    if (!sheet) return;
    sheet.remove();
    sheet = null;
    html.style.overflow = '';
    document.removeEventListener('keydown', sheetKey);
  }
  function sheetKey(e) { if (e.key === 'Escape') closeSheet(); }
  function openSheet(tag) {
    closeSheet();
    var rest = tags.slice().sort().filter(function (t) { return !CFG.SEGMENTS.some(function (g) { return g.tag === t; }); });
    sheet = document.createElement('div');
    sheet.className = 'sp-ep-sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-label', 'more topics');
    sheet.innerHTML = '<div class="sp-sheet-panel"><button type="button" class="sp-sheet-handle" aria-label="close"></button>' + rest.map(function (t) {
      return '<a href="' + esc(tagUrl(t)) + '"' + (t === tag ? ' class="sp-on" aria-current="page"' : '') + '><span>' + esc(t) + '</span>' + (t === tag ? '<span aria-hidden="true">\u2713</span>' : '') + '</a>';
    }).join('') + '</div>';
    var panel = sheet.firstChild;
    sheet.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      if (a) { e.preventDefault(); closeSheet(); go(a.href); return; }
      if (!panel.contains(e.target) || e.target.closest('.sp-sheet-handle')) closeSheet();
    });
    // drag the sheet down to dismiss
    var y0 = null;
    panel.addEventListener('touchstart', function (e) { y0 = panel.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
    panel.addEventListener('touchmove', function (e) {
      if (y0 == null) return;
      var dy = e.touches[0].clientY - y0;
      panel.style.transform = dy > 0 ? 'translateY(' + dy + 'px)' : '';
    }, { passive: true });
    panel.addEventListener('touchend', function (e) {
      if (y0 == null) return;
      var dy = e.changedTouches[0].clientY - y0;
      y0 = null;
      if (dy > 70) closeSheet(); else panel.style.transform = '';
    });
    document.addEventListener('keydown', sheetKey);
    html.style.overflow = 'hidden';
    document.body.appendChild(sheet);
    var first = sheet.querySelector('a.sp-on') || sheet.querySelector('a');
    if (first) first.focus({ preventScroll: true });
  }

  // ---------- router ----------
  function fixedHeader() {
    var header = document.querySelector('#header, header.header');
    return header && /fixed|sticky/.test(getComputedStyle(header).position) ? Math.max(0, header.getBoundingClientRect().bottom) : 0;
  }
  function show(route) {
    if (heroApi) { heroApi.stop(); heroApi = null; }
    closeSheet();
    if (route.view === 'archive') renderArchive(route.tag); else renderBrowse();
    root.hidden = false;
    root.style.setProperty('--sp-top', fixedHeader() + 'px');
    fullBleed();
  }
  function go(href) {
    var route = parse(href);
    if (!route) { location.href = href; return; }
    history.pushState(null, '', href);
    show(route);
    window.scrollTo(0, 0);
  }
  function init() {
    // Links between the landing page and the archive swap the view in place (no reload).
    root.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest('a[href]');
      var route = a && parse(a.href);
      if (!route) return;
      e.preventDefault();
      go(a.href);
    });
    window.addEventListener('popstate', function () {
      var route = parse(location.href) || (onCollection ? null : { view: 'browse' });
      if (route) show(route); else location.reload();
    });
    window.addEventListener('resize', function () {
      fullBleed();
      root.style.setProperty('--sp-top', fixedHeader() + 'px');
      if (heroApi) heroApi.relayout();
      if (inner.querySelector('.sp-stack')) updateArrows();
    });
    // scroll doesn't bubble, so listen in the capture phase for every row at once
    inner.addEventListener('scroll', function (e) {
      var wrap = e.target.parentElement;
      if (wrap && wrap.classList && wrap.classList.contains('sp-row-wrap')) wrap.classList.toggle('sp-at-start', e.target.scrollLeft <= 2);
    }, true);
    if (reduced.addEventListener) reduced.addEventListener('change', function () { if (heroApi) heroApi.schedule(); });
    if (mobile.addEventListener) mobile.addEventListener('change', function () { var r = parse(location.href) || { view: 'browse' }; show(r); });
    show(parse(location.href) || { view: 'browse' });
  }

  // ---------- go ----------
  load().then(function (data) {
    episodes = (data.episodes || []).filter(function (e) { return e && e.number != null && e.url; })
      .map(function (e) { e.tags = e.tags || []; return e; })
      .sort(function (a, b) { return b.number - a.number; });
    if (!episodes.length) throw new Error('no episodes');
    episodes.forEach(function (e) { byNumber[e.number] = e; });
    tags = data.tags || [];
    init();
  }).catch(function () {
    // Nothing to show: hand the page back to Squarespace's own list.
    html.classList.remove('sp-ep-custom');
    if (section) section.classList.remove('sp-ep-section');
  });
})();
</script>
